[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["tests/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "BLE", "RET"]
ignore = [
    "E501",     # long strings/comments are fine; the formatter handles code
    "E701", "E702",   # compact one-liners in the glyph drawing helpers
    "RET504", "RET505", "SIM108",
    "PERF203",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "BLE001"]
