[mypy]
ignore_missing_imports = True
check_untyped_defs = True

# Strict where the logic lives (no Qt widgets here)
[mypy-ff4_editor.model.*,ff4_editor.config_manager,ff4_editor.errors,ff4_editor.typed_config,ff4_editor.util.text_processing]
disallow_untyped_defs = True

# Mixins of FF4Editor use attributes that live on the host class
[mypy-ff4_editor.ui_actions,ff4_editor.ui_windowstate,ff4_editor.ui_sections]
disable_error_code = attr-defined
